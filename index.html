<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05030f" />
    <title>MachZero</title>
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
      html, body { margin: 0; height: 100%; background: #05030f; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; }
      #hud { position: fixed; inset: 0; pointer-events: none; }
      #boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #19f0ff; font: 600 14px/1.4 ui-monospace, Menlo, monospace; letter-spacing: 0.3em;
        text-shadow: 0 0 12px #19f0ff; background: #05030f; z-index: 100; transition: opacity 0.4s;
      }
      #boot.error { color: #ff3344; text-shadow: 0 0 12px #ff3344; white-space: pre-wrap; padding: 24px; letter-spacing: 0.05em; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="ui"></div>
    <div id="boot">INITIALISING MACHZERO…</div>
    <div class="mz-rotate" role="alert" aria-live="assertive">
      <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="14" y="6" width="20" height="36" rx="3" fill="none" stroke="currentColor" stroke-width="3" /><path d="M6 30 A18 18 0 0 0 20 44 M6 30 l-2 6 M6 30 l6 1" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" /></svg>
      <span>ROTATE YOUR DEVICE</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
