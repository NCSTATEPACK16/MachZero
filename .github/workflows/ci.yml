name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, build, size
    runs-on: ubuntu-latest
    # Normally ~1 min. Every unit test is capped at 2 min (vite.config.ts).
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - run: npm run size

  smoke:
    name: Browser smoke test
    runs-on: ubuntu-latest
    # Normally ~2 min. Every e2e test is capped at 2 min (playwright.config.ts).
    timeout-minutes: 10
    # Browsers and their system libraries come preinstalled; installing them on the runner took up to 11 min.
    # The tag must match @playwright/test in package-lock.json (scripts/check-playwright-image.mjs enforces it).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/check-playwright-image.mjs
      - run: npx vite build
      - run: npm run smoke
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
